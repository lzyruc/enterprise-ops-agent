[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-ops-agent"
version = "1.0.0"
description = "Production-minded enterprise operations Agent with RAG, RBAC, HITL, memory, tracing and MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "openai>=1.50,<3",
  "httpx>=0.27,<1",
  "tenacity>=9,<10",
  "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]

[project.scripts]
enterprise-agent = "enterprise_agent.cli:main"
enterprise-agent-api = "enterprise_agent.api:run"
enterprise-agent-mcp = "enterprise_agent.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
"src/enterprise_agent/engine.py" = ["BLE001"]
